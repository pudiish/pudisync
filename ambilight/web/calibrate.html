<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Calibrate Colours</title>
<style>
:root{
  color-scheme:dark;
  --panel:#151513;--raised:#1f1e1b;--inset:#070706;--rule:#2b2a26;--rule-hi:#3b3a35;
  --ink:#ece6d6;--dim:#a49d8c;--amber:#ffb000;--amber-ink:#1a1200;--red:#ff6a55;
  --text:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bevel:inset 0 1px 0 rgb(255 255 255/.06),inset 0 -1px 0 rgb(0 0 0/.55);
  --sunk:inset 0 1px 3px rgb(0 0 0/.85);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
/* The page colour is the test patch: the strip samples the screen edges, so the panel sits in the middle. */
body{display:grid;place-items:center;background:#fff;color:var(--ink);font:15px/1.5 var(--text);
  -webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:14px;
  padding:18px;background:var(--panel);border:1px solid var(--rule);border-top-color:var(--rule-hi);
  border-radius:4px;box-shadow:var(--bevel),0 12px 40px rgb(0 0 0/.5)}
h1,h2{margin:0;font:600 11px/1.3 var(--text);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:10px}
h1{font-size:13px;color:var(--amber);font-family:var(--mono);letter-spacing:.2em}
h1::after,h2::after{content:"";flex:1;height:1px;background:var(--rule)}
p{margin:0;font-size:13px;color:var(--dim)}
.patches{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.patches button{min-height:44px;border:1px solid #000;border-radius:2px;box-shadow:inset 0 0 0 2px rgb(0 0 0/.3)}
.patches button[aria-pressed=true]{outline:2px solid var(--amber);outline-offset:2px}
.fader{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}
.fader label{font:600 12px/1.3 var(--text);letter-spacing:.14em;text-transform:uppercase}
.fader output{font:600 14px/1 var(--mono);color:var(--amber);background:var(--inset);border:1px solid #000;
  border-radius:2px;box-shadow:var(--sunk);padding:6px 8px;min-width:72px;text-align:right;
  font-variant-numeric:tabular-nums}
.fader input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;background:var(--inset);border:1px solid #000;
  border-radius:1px;box-shadow:var(--sunk)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:34px;margin-top:-14px;
  border:1px solid #000;border-radius:2px;background:#cfc8b6;
  box-shadow:inset 0 0 0 1px #ebe5d5,inset 0 -7px 0 #9d9684,0 2px 3px rgb(0 0 0/.6)}
input[type=range]::-moz-range-track{height:8px;background:var(--inset);border:1px solid #000}
input[type=range]::-moz-range-thumb{width:22px;height:34px;border:1px solid #000;border-radius:2px;
  background:#cfc8b6;box-shadow:inset 0 -7px 0 #9d9684}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{flex:1 1 120px;min-height:44px;padding:0 14px;border:1px solid var(--rule-hi);border-bottom-color:#000;
  border-radius:4px;background:var(--raised);box-shadow:var(--bevel);
  font:600 11.5px/1.2 var(--text);letter-spacing:.12em;text-transform:uppercase}
.btn:active{box-shadow:var(--sunk);transform:translateY(1px)}
.btn.primary{background:var(--amber);color:var(--amber-ink);border-color:#ffd166 #7a5400 #4d3500}
.msg{min-height:1.5em;font-size:13px;color:var(--red)}
.reveal{position:fixed;inset:0;width:100%;height:100%;border:0;background:none;opacity:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<button class="reveal" id="reveal" type="button" aria-label="Show the calibration panel" hidden></button>
<main class="panel" id="panel">
  <h1>Match the strip to the screen</h1>
  <p>Keep screen sync on. Pick a patch, then move the sliders until the light on the wall looks like
    the screen. Start with white, then the greys. Arrow keys change patch; H hides this panel.</p>
  <div class="patches" id="patches" role="group" aria-label="Test patches"></div>
  <h2>Look</h2>
  <div class="fader" data-key="white_kelvin" data-label="Warmth"></div>
  <div class="fader" data-key="contrast" data-label="Contrast"></div>
  <div class="fader" data-key="saturation" data-label="Colour"></div>
  <h2>Fine tune</h2>
  <p>Strip balance trims each LED channel on the strip side.</p>
  <div class="fader" data-key="wb_r" data-label="Strip balance red"></div>
  <div class="fader" data-key="wb_g" data-label="Strip balance green"></div>
  <div class="fader" data-key="wb_b" data-label="Strip balance blue"></div>
  <div class="fader" data-key="led_gamma" data-label="LED gamma"></div>
  <div class="fader" data-key="black_level" data-label="Black cut-off"></div>
  <div class="row">
    <button class="btn primary" type="button" id="sync-on" hidden>Turn screen sync on</button>
    <button class="btn" type="button" id="hide">Hide panel (H)</button>
    <button class="btn" type="button" id="full">Full screen (F)</button>
  </div>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>
<script>
"use strict";
const PIN_KEY = "ambilight-pin";
const PATCHES = [
  ["White", "#ffffff"], ["Grey 75%", "#bfbfbf"], ["Grey 50%", "#808080"], ["Grey 25%", "#404040"],
  ["Grey 10%", "#1a1a1a"], ["Red", "#ff0000"], ["Green", "#00ff00"], ["Blue", "#0000ff"],
  ["Skin", "#e0ac8a"], ["Black", "#000000"],
];
const two = v => Number(v).toFixed(2);
const SLIDERS = {
  white_kelvin: {min: 2700, max: 6500, step: 100, fmt: v => `${Math.round(v)} K`},
  contrast: {min: 0.5, max: 2.5, step: 0.05, fmt: v => `${two(v)}×`},
  saturation: {min: 0.5, max: 2, step: 0.05, fmt: v => `${Math.round(v * 100)}%`},
  wb_r: {min: 0.2, max: 1, step: 0.01, fmt: two},
  wb_g: {min: 0.2, max: 1, step: 0.01, fmt: two},
  wb_b: {min: 0.2, max: 1, step: 0.01, fmt: two},
  led_gamma: {min: 0.8, max: 2.5, step: 0.05, fmt: two},
  black_level: {min: 0, max: 0.12, step: 0.005, fmt: v => Number(v).toFixed(3)},
};
const $ = id => document.getElementById(id);
const pin = takePin();
let current = 0;

function takePin() {
  const params = new URLSearchParams(location.search);
  const given = params.get("pin");
  if (given == null) {
    try { return localStorage.getItem(PIN_KEY) || ""; }
    catch (err) { console.warn("PIN storage unavailable", err); return ""; }
  }
  // Keep the PIN out of the address bar and history once it has been read.
  history.replaceState(null, "", location.pathname);
  try { localStorage.setItem(PIN_KEY, given); }
  catch (err) { console.warn("PIN kept for this visit only", err); }
  return given;
}

const msg = text => { $("msg").textContent = text || ""; };

async function api(path, params) {
  const query = new URLSearchParams(params || {}).toString();
  let res;
  try {
    res = await fetch(path + (query ? `?${query}` : ""),
      {cache: "no-store", headers: pin ? {"X-Ambilight-Pin": pin} : {}});
  } catch (err) {
    throw new Error("Can't reach the hub.");
  }
  const body = await res.json().catch(() => ({}));
  if (res.status === 403) throw new Error("Locked: open this page from the hub's Setup screen to pass the PIN.");
  if (!res.ok || body.error) throw new Error(body.error || `The hub answered ${res.status}.`);
  return body;
}

function show(i) {
  current = (i + PATCHES.length) % PATCHES.length;
  document.body.style.background = PATCHES[current][1];
  document.querySelectorAll("#patches button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === current)));
}

function buildPatches() {
  PATCHES.forEach(([name, hex], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.style.background = hex;
    b.setAttribute("aria-label", name);
    b.addEventListener("click", () => show(i));
    $("patches").append(b);
  });
}

function showValue(input, out, spec) {
  const text = spec.fmt(input.value);
  out.textContent = text;
  input.setAttribute("aria-valuetext", text);
}

function buildFader(host) {
  const key = host.dataset.key, spec = SLIDERS[key], id = `f-${key}`;
  const label = document.createElement("label");
  label.htmlFor = id;
  label.textContent = host.dataset.label;
  const out = document.createElement("output");
  out.setAttribute("for", id);
  const input = document.createElement("input");
  Object.assign(input, {type: "range", id, min: spec.min, max: spec.max, step: spec.step});
  host.append(label, out, input);
  showValue(input, out, spec);
  let timer = 0;
  input.addEventListener("input", () => {
    showValue(input, out, spec);
    clearTimeout(timer);
    timer = setTimeout(() => api("/api/set", {[key]: input.value}).then(() => msg(""), e => msg(e.message)), 80);
  });
}

async function load() {
  try {
    const cfg = await api("/api/status");
    for (const key of Object.keys(SLIDERS)) {
      const input = $(`f-${key}`);
      if (cfg[key] == null) continue;
      input.value = cfg[key];
      showValue(input, input.previousElementSibling, SLIDERS[key]);
    }
    $("sync-on").hidden = cfg.running;
    msg(cfg.running ? "" : "Screen sync is off: turn it on so the strip follows this page.");
  } catch (e) {
    msg(e.message);
  }
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(e => msg(e.message));
}

function setHidden(hidden) {
  $("panel").hidden = hidden;
  $("reveal").hidden = !hidden;
  if (!hidden) $("hide").focus();
}

$("sync-on").addEventListener("click", () => api("/api/sync/on").then(load, e => msg(e.message)));
$("hide").addEventListener("click", () => setHidden(true));
$("reveal").addEventListener("click", () => setHidden(false));
$("full").addEventListener("click", toggleFull);
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  if (e.key === "h" || e.key === "H") setHidden(!$("panel").hidden);
  else if (e.key === "f" || e.key === "F") toggleFull();
  else if (e.key === "ArrowRight") show(current + 1);
  else if (e.key === "ArrowLeft") show(current - 1);
});

buildPatches();
document.querySelectorAll("[data-key]").forEach(buildFader);
show(0);
load();
</script>
</body>
</html>
