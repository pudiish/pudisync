<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calibrate colours</title>
<style>
  :root { --panel: rgba(20, 20, 22, .92); --ink: #f2f2f2; --muted: #a8a8ad; --line: #3a3a40; }
  html, body { margin: 0; height: 100%; background: #fff; color: var(--ink);
               font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; transition: background .25s; }
  /* The strip samples the screen edges only, so the panel sits in the middle. */
  .panel { width: min(420px, 90vw); background: var(--panel); border: 1px solid var(--line);
           border-radius: 14px; padding: 18px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .panel.hidden { display: none; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .patches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
  .patches button { height: 34px; border-radius: 8px; border: 2px solid transparent; cursor: pointer; }
  .patches button.on { border-color: #fff; }
  label { display: grid; grid-template-columns: 110px 1fr 46px; align-items: center; gap: 8px;
          margin: 8px 0; font-size: 13px; }
  label output { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; }
  .row { display: flex; gap: 8px; margin-top: 14px; }
  .row button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
                background: #2a2a30; color: var(--ink); cursor: pointer; }
  .msg { min-height: 18px; margin-top: 8px; font-size: 12px; color: #ff9b8a; }
</style>
</head>
<body>
<div class="panel" id="panel">
  <h1>Match the strip to the screen</h1>
  <p>Keep screen sync on. Pick a patch, then move the sliders until the light
     on the wall looks like the screen. Start with white, then the greys.</p>
  <div class="patches" id="patches"></div>
  <label>Warmth (K) <input type="range" id="white_kelvin" min="2700" max="6500" step="100"><output></output></label>
  <label>Red balance <input type="range" id="wb_r" min="0.2" max="1" step="0.01"><output></output></label>
  <label>Green balance <input type="range" id="wb_g" min="0.2" max="1" step="0.01"><output></output></label>
  <label>Blue balance <input type="range" id="wb_b" min="0.2" max="1" step="0.01"><output></output></label>
  <label>LED gamma <input type="range" id="led_gamma" min="0.8" max="2.5" step="0.05"><output></output></label>
  <label>Colour intensity <input type="range" id="saturation" min="0.5" max="2" step="0.05"><output></output></label>
  <label>Black cut-off <input type="range" id="black_level" min="0" max="0.12" step="0.005"><output></output></label>
  <div class="row">
    <button id="hide">Hide panel (H)</button>
    <button id="full">Full screen (F)</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
const PATCHES = [
  ["White", "#ffffff"], ["Grey 75%", "#bfbfbf"], ["Grey 50%", "#808080"], ["Grey 25%", "#404040"],
  ["Grey 10%", "#1a1a1a"], ["Red", "#ff0000"], ["Green", "#00ff00"], ["Blue", "#0000ff"],
  ["Skin", "#e0ac8a"], ["Black", "#000000"],
];
const pin = new URLSearchParams(location.search).get("pin") || "";
const $ = id => document.getElementById(id);
const msg = text => { $("msg").textContent = text || ""; };

async function api(path, params = {}) {
  const q = new URLSearchParams(params);
  if (pin) q.set("pin", pin);
  const res = await fetch(path + "?" + q);
  const body = await res.json();
  if (!res.ok || body.error) throw new Error(body.error || res.statusText);
  return body;
}

let current = 0;
function show(i) {
  current = (i + PATCHES.length) % PATCHES.length;
  document.body.style.background = PATCHES[current][1];
  document.querySelectorAll("#patches button").forEach((b, k) => b.classList.toggle("on", k === current));
}
PATCHES.forEach(([name, hex], i) => {
  const b = document.createElement("button");
  b.title = name;
  b.style.background = hex;
  b.onclick = () => show(i);
  $("patches").append(b);
});

const SLIDERS = ["white_kelvin", "wb_r", "wb_g", "wb_b", "led_gamma", "saturation", "black_level"];
const fmt = (key, v) => key === "white_kelvin" ? String(Math.round(v)) : Number(v).toFixed(2);
for (const key of SLIDERS) {
  const el = $(key), out = el.nextElementSibling;
  let timer = null;
  el.oninput = () => {
    out.textContent = fmt(key, el.value);
    clearTimeout(timer);
    timer = setTimeout(() => api("/api/set", { [key]: el.value }).then(() => msg(""), e => msg(e.message)), 80);
  };
}

async function load() {
  try {
    const cfg = await api("/api/config");
    for (const key of SLIDERS) {
      $(key).value = cfg[key];
      $(key).nextElementSibling.textContent = fmt(key, cfg[key]);
    }
    const st = await api("/api/status");
    if (!st.running) msg("Screen sync is off: turn it on so the strip follows this page.");
  } catch (e) { msg(e.message); }
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(e => msg(e.message));
}
$("hide").onclick = () => $("panel").classList.add("hidden");
$("full").onclick = toggleFull;
document.addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") $("panel").classList.toggle("hidden");
  else if (e.key === "f" || e.key === "F") toggleFull();
  else if (e.key === "ArrowRight") show(current + 1);
  else if (e.key === "ArrowLeft") show(current - 1);
});

show(0);
load();
</script>
</body>
</html>
