<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="PudiSync">
  <defs>
    <radialGradient id="tile" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0d0c18"/>
      <stop offset="1" stop-color="#05050a"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf6ff"/>
      <stop offset=".45" stop-color="#fbf7f4"/>
      <stop offset=".75" stop-color="#ffe9ec"/>
      <stop offset="1" stop-color="#d9cbff"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5fb"/>
      <stop offset="1" stop-color="#cbbcff"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4da8" stop-opacity=".75"/>
      <stop offset="1" stop-color="#c77a9a" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset=".55" stop-color="#9a5cff"/>
      <stop offset=".8" stop-color="#ff3d8a"/>
      <stop offset="1" stop-color="#ff8a1e"/>
    </linearGradient>
    <radialGradient id="ember" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(770 330) scale(210)">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#ff7a1e" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ff6a1e" stop-opacity="0"/>
    </radialGradient>
    <!-- The letter: a ribbon bowl and a stem that folds under it. -->
    <path id="bowl" d="M295 437C297 342 353 279 449 279H615C707 279 772 346 772 437C772 529 707 595 615 595H465L462 472H611C661 472 661 382 611 382H368C333 382 306 403 295 437Z"/>
    <path id="leg" d="M304 579C304 515 350 469 432 469H465V668C465 697 453 708 433 717L322 785C312 790 304 785 304 775Z"/>
    <g id="mark"><use href="#bowl"/><use href="#leg"/></g>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>
  <rect x="2" y="2" width="1020" height="1020" rx="228" fill="none" stroke="#ffffff" stroke-opacity=".06" stroke-width="4"/>

  <!-- Glow as stacked translucent strokes, not a blur filter: macOS's own SVG
       renderer (which draws the app icon) ignores filters. -->
  <circle cx="770" cy="330" r="210" fill="url(#ember)"/>
  <g fill="none" stroke="url(#halo)" stroke-linejoin="round" stroke-opacity=".035">
    <use href="#mark" stroke-width="150"/>
    <use href="#mark" stroke-width="138"/>
    <use href="#mark" stroke-width="126"/>
    <use href="#mark" stroke-width="114"/>
    <use href="#mark" stroke-width="102"/>
    <use href="#mark" stroke-width="90"/>
    <use href="#mark" stroke-width="80"/>
    <use href="#mark" stroke-width="70"/>
    <use href="#mark" stroke-width="60"/>
    <use href="#mark" stroke-width="51"/>
    <use href="#mark" stroke-width="42"/>
    <use href="#mark" stroke-width="34"/>
    <use href="#mark" stroke-width="27"/>
    <use href="#mark" stroke-width="20"/>
    <use href="#mark" stroke-width="14"/>
    <use href="#mark" stroke-width="9"/>
  </g>

  <use href="#bowl" fill="url(#face)"/>
  <path d="M465 472L700 456C672 534 586 580 465 595Z" fill="url(#fold)"/>
  <use href="#leg" fill="url(#stem)"/>
</svg>
